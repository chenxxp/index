<title>地质三维 — UI设计稿 v3</title>
<style>
/* ==================== 主题变量 ==================== */
:root{
  --nav-h: 56px;
  --drawer-w: 372px;
}
/* 主题：政务蓝（庄重、规范，贴合政务系统视觉） */
body[data-theme="gov"]{
  --bg1:#071A33; --bg2:#0C2A4E; --bg3:#123A6B;
  --surface: rgba(9,28,54,.92);
  --surface2: rgba(13,40,74,.96);
  --line: rgba(110,170,255,.26);
  --line-strong: rgba(110,170,255,.55);
  --accent:#4E8DF7; --accent-2:#8FD0FF; --accent-dim:rgba(78,141,247,.16);
  --glow: rgba(78,141,247,.42);
  --text:#EDF4FF; --text-muted:#A8C4E8; --text-dim:#7C9AC2;
  --danger:#FF6B5E; --warn:#FFB84D; --ok:#4FD98A;
  --title-grad: linear-gradient(180deg,#FFFFFF 20%,#D6E7FF 58%,#6FA5FF 100%);
  --title-glow: rgba(78,141,247,.55);
  --road-a: rgba(120,180,255,.075);
  --road-b: rgba(120,180,255,.055);
}

* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif; }

/* ============ 地图底图 ============ */
.map-bg{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 900px 620px at 42% 58%, var(--bg3), transparent 72%),
    radial-gradient(ellipse 520px 420px at 55% 45%, var(--bg2), transparent 72%),
    radial-gradient(ellipse 420px 320px at 36% 70%, var(--bg2), transparent 72%),
    linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 35%, var(--bg3) 60%, var(--bg2) 82%, var(--bg1) 100%);
  transition:background .5s ease;
}
.map-bg::before{ /* 路网 */
  content:""; position:absolute; inset:0;
  background:
    repeating-linear-gradient(115deg, transparent 0 92px, var(--road-a) 92px 94px),
    repeating-linear-gradient(26deg, transparent 0 132px, var(--road-b) 132px 134px),
    repeating-linear-gradient(74deg, transparent 0 214px, rgba(200,215,205,.04) 214px 216px);
}
.map-bg::after{ /* 水系 */
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(ellipse 320px 84px at 70% 88%, rgba(64,148,178,.30), transparent 70%),
    radial-gradient(ellipse 210px 62px at 24% 15%, rgba(64,148,178,.22), transparent 70%);
}
.city-glow{ position:absolute; border-radius:50%; filter:blur(8px); pointer-events:none;
  background:rgba(255,208,120,.15); }

/* 地图上的标记点 */
.pin{ position:absolute; width:11px; height:11px; border-radius:50%; cursor:pointer;
  border:1.5px solid rgba(255,255,255,.75); }
.pin::after{ content:""; position:absolute; inset:-7px; border-radius:50%;
  border:1px solid currentColor; opacity:.45; animation:pulse 2.4s infinite; }
@keyframes pulse{ 0%{transform:scale(.6);opacity:.7} 100%{transform:scale(1.5);opacity:0} }
.pin.red{ background:var(--danger); color:var(--danger); }
.pin.orange{ background:var(--warn); color:var(--warn); }
.pin.green{ background:var(--ok); color:var(--ok); }

/* ============ 顶部导航（三栏 grid，杜绝文字重叠） ============ */
.topbar{
  position:absolute; top:0; left:0; right:0; height:var(--nav-h); z-index:120;
  display:grid; grid-template-columns: auto minmax(0,1fr) auto;
  align-items:center; column-gap:8px; padding:0 14px;
  background:linear-gradient(180deg, var(--surface2) 0%, var(--surface) 78%, rgba(0,0,0,0) 100%);
  backdrop-filter:blur(8px);
}
.topbar::after{
  content:""; position:absolute; left:0; right:0; top:calc(var(--nav-h) - 2px); height:2px;
  background:linear-gradient(90deg,transparent, var(--line-strong) 12%, var(--accent) 50%, var(--line-strong) 88%, transparent);
  box-shadow:0 0 14px var(--glow);
}

.nav-left{ display:flex; align-items:center; gap:2px; grid-column:1; }
.menu-item{ position:relative; }
/* 图标在上、文字在下的双行菜单 */
.menu-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:5px 13px 4px; border-radius:9px; cursor:pointer; user-select:none;
  color:var(--text-muted); white-space:nowrap; line-height:1.25;
  border:1px solid transparent; transition:all .22s ease;
}
.menu-btn .ico{ width:19px; height:19px; flex:none; opacity:.92; }
.menu-btn .txt{ font-size:12.6px; letter-spacing:.6px; }
.menu-btn:hover, .menu-item.active .menu-btn{
  color:#fff; border-color:var(--line-strong);
  background:linear-gradient(180deg, var(--accent-dim), rgba(0,0,0,.12));
  box-shadow:0 0 14px var(--glow), inset 0 0 12px var(--accent-dim);
}
.menu-btn:hover .ico, .menu-item.active .menu-btn .ico{ color:var(--accent-2); }
.badge-new{
  position:absolute; top:-3px; right:1px; font-size:9px; line-height:14px; padding:0 5px;
  border-radius:7px; color:#3A2600; background:linear-gradient(180deg,#FFD780,#F2A93B);
  font-weight:700; box-shadow:0 0 8px rgba(242,169,59,.6); letter-spacing:0;
}

/* 二级下拉 */
.dropdown{
  position:absolute; top:calc(100% + 9px); left:6px; min-width:188px; z-index:130;
  background:var(--surface2); border:1px solid var(--line); border-radius:11px; padding:6px;
  box-shadow:0 14px 40px rgba(0,0,0,.62), 0 0 22px var(--accent-dim);
  opacity:0; visibility:hidden; transform:translateY(-8px); transition:all .2s ease;
}
.dropdown::before{ content:""; position:absolute; top:-6px; left:24px; width:10px; height:10px;
  background:var(--surface2); border-left:1px solid var(--line); border-top:1px solid var(--line);
  transform:rotate(45deg); border-radius:2px 0 0 0; }
.menu-item:hover .dropdown{ opacity:1; visibility:visible; transform:translateY(0); }
.di{ display:flex; align-items:center; gap:9px; padding:8px 11px; border-radius:7px;
  cursor:pointer; color:var(--text-muted); font-size:13px; line-height:1.4; transition:all .16s; }
.di .dot{ width:5px; height:5px; border-radius:50%; background:var(--line-strong); flex:none; transition:all .16s; }
.di:hover{ color:#fff; background:linear-gradient(90deg, var(--accent-dim), transparent); transform:translateX(3px); }
.di:hover .dot{ background:var(--accent); box-shadow:0 0 8px var(--accent); }
.divider{ height:1px; margin:5px 10px; background:linear-gradient(90deg,transparent,var(--line),transparent); }

/* 居中标题（独立列，永不与左右内容重叠） */
.title-wrap{ grid-column:2; display:flex; justify-content:center; align-items:center; min-width:0; pointer-events:none; }
.main-title{
  position:relative; white-space:nowrap; font-weight:700; letter-spacing:4px;
  font-size:clamp(17px, 1.55vw, 27px); line-height:1.2;
  background:var(--title-grad); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; text-shadow:0 0 24px var(--title-glow);
  padding:0 clamp(10px, 2vw, 40px);
}
.title-wrap .wing{ position:absolute; top:50%; transform:translateY(-50%); }
.title-wrap .wing.l{ right:100%; margin-right:-4px; }
.title-wrap .wing.r{ left:100%; margin-left:-4px; transform:translateY(-50%) scaleX(-1); }

/* 右侧功能区 */
.nav-right{ grid-column:3; display:flex; align-items:center; justify-content:flex-end; gap:9px; }
.search-box{
  display:flex; align-items:center; gap:8px; width:clamp(180px, 17vw, 300px);
  background:rgba(0,0,0,.28); border:1px solid var(--line);
  border-radius:17px; padding:5px 7px 5px 13px; transition:all .24s;
}
.search-box:focus-within{ border-color:var(--line-strong); box-shadow:0 0 14px var(--glow); }
.search-box .ico{ width:15px; height:15px; color:var(--text-dim); flex:none; }
.search-box input{ flex:1; min-width:0; background:none; border:none; outline:none;
  color:var(--text); font-size:12.6px; }
.search-box input::placeholder{ color:var(--text-dim); }
.search-btn{ flex:none; background:var(--accent); border:none; color:#20160A; font-weight:700;
  font-size:12.4px; letter-spacing:1px; padding:4.5px 15px; border-radius:12px; cursor:pointer; transition:all .2s; }
.search-btn:hover{ filter:brightness(1.12); box-shadow:0 0 14px var(--glow); }
.icon-btn{
  display:flex; align-items:center; gap:6px; white-space:nowrap;
  color:var(--text-muted); font-size:12.6px; cursor:pointer; padding:6px 11px;
  border-radius:8px; border:1px solid var(--line); background:rgba(0,0,0,.22); transition:all .2s;
}
.icon-btn:hover{ color:#fff; border-color:var(--line-strong); background:var(--accent-dim); }
.icon-btn .ico{ width:15px; height:15px; }

/* ============ 右侧业务抽屉 ============ */
.drawer{
  position:absolute; top:calc(var(--nav-h) + 10px); right:-400px; bottom:16px; width:var(--drawer-w);
  z-index:110; display:flex; flex-direction:column; overflow:hidden;
  background:var(--surface2); border:1px solid var(--line); border-radius:13px;
  box-shadow:-8px 0 42px rgba(0,0,0,.6), 0 0 26px var(--accent-dim);
  backdrop-filter:blur(10px);
  transition:right .35s cubic-bezier(.22,.85,.3,1);
}
.drawer.open{ right:16px; }
.dw-head{ flex:none; display:flex; align-items:center; gap:10px; padding:12px 14px;
  border-bottom:1px solid var(--line); }
.dw-head .bar{ width:3px; height:17px; border-radius:2px; background:var(--accent); box-shadow:0 0 8px var(--accent); flex:none; }
.dw-head h3{ font-size:15px; color:#fff; letter-spacing:1px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dw-head .cls{ width:26px; height:26px; border-radius:7px; border:1px solid var(--line);
  color:var(--text-muted); background:none; cursor:pointer; font-size:14px; line-height:1; transition:all .2s; flex:none; }
.dw-head .cls:hover{ color:#fff; border-color:var(--line-strong); background:var(--accent-dim); }
#dwBody{ display:flex; flex-direction:column; min-height:0; flex:1 1 auto; }

/* 指标卡 */
.kpis{ flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:11px 14px 3px; }
.kpi{ background:rgba(0,0,0,.26); border:1px solid var(--line); border-radius:9px; padding:8px 9px; overflow:hidden; }
.kpi .v{ font-size:17px; font-weight:700; color:var(--accent-2); line-height:1.2; white-space:nowrap; }
.kpi .v small{ font-size:10.5px; color:var(--text-dim); font-weight:400; margin-left:2px; }
.kpi .l{ font-size:11px; color:var(--text-dim); margin-top:2px; white-space:nowrap; }

/* 筛选行 */
.filters{ flex:none; display:flex; align-items:center; gap:6px; padding:9px 14px 8px; flex-wrap:wrap; }
.chip{ font-size:11.6px; padding:3.5px 11px; border-radius:12px; cursor:pointer;
  border:1px solid var(--line); color:var(--text-muted); background:rgba(0,0,0,.2); transition:all .18s; white-space:nowrap; }
.chip:hover{ color:#fff; border-color:var(--line-strong); }
.chip.on{ color:#20160A; background:var(--accent); border-color:var(--accent); font-weight:700; }
.mini-search{ flex:1; min-width:96px; display:flex; align-items:center; gap:6px;
  border:1px solid var(--line); border-radius:12px; padding:3.5px 10px; background:rgba(0,0,0,.2); }
.mini-search input{ flex:1; min-width:0; background:none; border:none; outline:none; color:var(--text); font-size:11.6px; }
.mini-search .ico{ width:12px; height:12px; color:var(--text-dim); flex:none; }

/* 列表 */
.list{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 10px 6px; }
.list::-webkit-scrollbar{ width:5px; }
.list::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:3px; }
.list::-webkit-scrollbar-track{ background:transparent; }
.row{ display:grid; grid-template-columns:1fr auto; gap:3px 10px; align-items:center;
  padding:9px 11px; margin-bottom:7px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:rgba(0,0,0,.2); transition:all .18s; }
.row:hover{ border-color:var(--line-strong); background:var(--accent-dim); transform:translateX(-2px); }
.row.sel{ border-color:var(--accent); background:var(--accent-dim); box-shadow:0 0 12px var(--accent-dim); }
.row .nm{ grid-column:1; font-size:12.8px; color:var(--text); line-height:1.35; }
.row .ad{ grid-column:1; font-size:10.8px; color:var(--text-dim); line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .rt{ grid-row:1/3; grid-column:2; text-align:right; white-space:nowrap; }
.row .rt .n{ font-size:14px; font-weight:700; }
.row .rt .u{ font-size:10px; color:var(--text-dim); }
.tag{ font-size:10.2px; padding:1.5px 6px; border-radius:6px; margin-left:6px; white-space:nowrap; }
.tag.red{ color:var(--danger); border:1px solid var(--danger); background:rgba(255,107,94,.12); }
.tag.warn{ color:var(--warn); border:1px solid var(--warn); background:rgba(255,163,61,.12); }
.tag.ok{ color:var(--ok); border:1px solid var(--ok); background:rgba(111,206,123,.12); }

/* 时序曲线 */
.chart-card{ flex:none; margin:6px 10px 12px; border:1px solid var(--line); border-radius:10px;
  background:rgba(0,0,0,.26); padding:9px 11px 6px; }
.chart-hd{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:2px; }
.chart-hd .t{ font-size:12.4px; color:#fff; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chart-hd .lg{ font-size:10.6px; color:var(--text-dim); white-space:nowrap; flex:none; }
.chart-hd .lg i{ display:inline-block; width:12px; height:2px; vertical-align:3px; margin-right:4px; }
#chart{ width:100%; height:150px; display:block; }
#chart .grid{ stroke:var(--line); stroke-width:.6; stroke-dasharray:3 4; }
#chart .axis{ stroke:var(--line-strong); stroke-width:.8; }
#chart .tick{ fill:var(--text-dim); font-size:9px; }
#chart .areaA{ fill:url(#ga); }
#chart .lineA{ fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; }
#chart .dotA{ fill:var(--bg2); stroke:var(--accent); stroke-width:1.6; cursor:pointer; }
#chart .dotA:hover{ fill:var(--accent); }
#tip{ position:absolute; pointer-events:none; opacity:0; transition:opacity .15s;
  background:var(--surface2); border:1px solid var(--line-strong); border-radius:7px;
  padding:5px 9px; font-size:11px; color:#fff; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.5); }

/* 图层面板 */
.sec-t{ font-size:12px; color:var(--text-dim); letter-spacing:1.5px; padding:11px 14px 7px; white-space:nowrap; }
.layer-row{ display:flex; align-items:center; gap:9px; padding:8px 12px; margin:0 10px 6px;
  border:1px solid var(--line); border-radius:8px; background:rgba(0,0,0,.2); cursor:pointer; transition:all .18s; }
.layer-row:hover{ border-color:var(--line-strong); background:var(--accent-dim); }
.layer-row .cb{ width:14px; height:14px; border-radius:4px; border:1px solid var(--line-strong);
  flex:none; display:flex; align-items:center; justify-content:center; font-size:9px; color:#20160A; }
.layer-row .cb.on{ background:var(--accent); }
.layer-row .ln{ font-size:12.6px; color:var(--text); flex:1; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.layer-row .cnt{ font-size:10.6px; color:var(--text-dim); flex:none; }
.slide-wrap{ padding:2px 14px 10px; }
.slide-lb{ display:flex; justify-content:space-between; font-size:11.4px; color:var(--text-muted); margin-bottom:5px; }
.slider{ -webkit-appearance:none; width:100%; height:3px; border-radius:2px; background:var(--line-strong); outline:none; }
.slider::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--accent); cursor:pointer; box-shadow:0 0 8px var(--glow); }

/* ============ 左下 dock ============ */
.dock{ position:absolute; left:16px; bottom:16px; z-index:90; display:flex; gap:8px; }
.dock-item{ display:flex; flex-direction:column; align-items:center; gap:3px;
  width:64px; padding:8px 4px 6px; cursor:pointer; border-radius:9px;
  background:var(--surface); border:1px solid var(--line);
  color:var(--text-muted); font-size:10.8px; line-height:1.25; text-align:center; transition:all .2s; }
.dock-item .ico{ width:18px; height:18px; }
.dock-item:hover, .dock-item.on{ color:#fff; border-color:var(--line-strong);
  background:var(--accent-dim); box-shadow:0 0 14px var(--accent-dim); }

/* 状态栏 / 罗盘（图例已移除） */
.statusbar{ position:absolute; right:16px; bottom:16px; z-index:90; display:flex; align-items:center; gap:14px;
  color:var(--text-dim); font-size:11.6px; background:var(--surface); border:1px solid var(--line);
  padding:5px 13px; border-radius:8px; backdrop-filter:blur(6px); transition:right .35s cubic-bezier(.22,.85,.3,1); }
body.dw-open .statusbar{ right:calc(var(--drawer-w) + 30px); }
.statusbar .line{ height:4px; border:1px solid var(--text-dim); border-top:none; width:62px; }
.compass{ position:absolute; top:calc(var(--nav-h) + 14px); right:16px; width:54px; height:54px; z-index:88;
  border-radius:50%; background:var(--surface2); border:1px solid var(--line-strong);
  box-shadow:0 4px 16px rgba(0,0,0,.5), 0 0 14px var(--accent-dim); display:flex;
  align-items:center; justify-content:center; cursor:pointer; transition:right .35s cubic-bezier(.22,.85,.3,1); }
body.dw-open .compass{ right:calc(var(--drawer-w) + 30px); }
.compass .n{ position:absolute; top:3px; color:var(--accent); font-size:12px; font-weight:700; }
.compass .nd{ position:absolute; top:11px; width:0; height:0; border-left:4.5px solid transparent;
  border-right:4.5px solid transparent; border-bottom:18px solid var(--danger); }
.compass .nd.s{ top:25px; border-bottom:none; border-top:18px solid var(--text); }

/* 提示 */
.toast{ position:absolute; left:50%; top:calc(var(--nav-h) + 18px); transform:translate(-50%,-14px);
  z-index:200; opacity:0; pointer-events:none; transition:all .3s;
  background:var(--surface2); border:1px solid var(--line-strong); border-radius:9px;
  padding:8px 18px; font-size:13px; color:#fff; box-shadow:0 8px 26px rgba(0,0,0,.55); white-space:nowrap; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* 窄屏兜底 */
@media (max-width:1460px){
  .title-wrap .wing{ display:none; }
  .search-box{ width:190px; }
}
@media (max-width:1240px){
  .icon-btn span{ display:none; }
  .icon-btn{ padding:6px 9px; }
}
</style>

    html += '<div class="filters"><span class="chip on" data-f="all">全部</span><span class="chip" data-f="red">超限</span>'+
      '<span class="chip" data-f="warn">关注</span><span class="chip" data-f="ok">正常</span>'+
      '<div class="mini-search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="kws" placeholder="搜索监测点"></div></div>'+
      '<div class="list" id="stList">'+listHTML(data.rows)+'</div>'+
      '<div class="chart-card"><div class="chart-hd"><span class="t" id="ctName">'+data.rows[0][1]+'</span>'+
      '<span class="lg"><i style="background:var(--accent)"></i>'+data.metric+'</span></div>'+
      '<div style="position:relative"><svg id="chart" viewBox="0 0 340 150" preserveAspectRatio="none"></svg><div id="tip"></div></div></div>';
  }

  dwBody.innerHTML = html;

  if(type==='chart'){
    bindRows('stList', data.rows);
    bindChips(data.rows);
    const kw = document.getElementById('kws');
    if(kw) kw.oninput = ()=>{
      const v = kw.value.trim();
      const fs = data.rows.filter(r=>r[1].indexOf(v)>=0||r[0].indexOf(v)>=0||r[2].indexOf(v)>=0);
      document.getElementById('stList').innerHTML = listHTML(fs);
      bindRows('stList', fs);
    };
    drawChart(data.rows[0], 18);
  }
  toast('已加载「'+name+'」业务面板');
}

function tgCB(el){
  const cb = el.querySelector('.cb');
  cb.classList.toggle('on');
  cb.innerHTML = cb.classList.contains('on') ? '&#10003;' : '';
}
function listHTML(rows){
  return rows.map((r,i)=>{
    let tg = '<span class="tag ok">正常</span>';
    if(r[5]==='red') tg = '<span class="tag red">超限</span>';
    if(r[5]==='warn') tg = '<span class="tag warn">关注</span>';
    const col = r[5]==='red'?'var(--danger)':(r[5]==='warn'?'var(--warn)':'var(--ok)');
    return '<div class="row'+(i===0?' sel':'')+'"><div class="nm">'+r[1]+tg+'</div>'+
      '<div class="ad">'+r[0]+' · '+r[2]+'</div>'+
      '<div class="rt"><div class="n" style="color:'+col+'">'+r[3]+'</div><div class="u">'+r[4]+' '+curUnit+'/a</div></div></div>';
  }).join('');
}
function bindRows(listId, rows){
  const box = document.getElementById(listId); if(!box) return;
  Array.prototype.forEach.call(box.querySelectorAll('.row'), (el,i)=>{
    el.onclick = ()=>{
      Array.prototype.forEach.call(box.querySelectorAll('.row'), x=>x.classList.remove('sel'));
      el.classList.add('sel');
      const t = document.getElementById('ctName'); if(t) t.textContent = rows[i][1];
      drawChart(rows[i], 10+i);
    };
  });
}
function bindChips(rows){
  Array.prototype.forEach.call(dwBody.querySelectorAll('.chip'), c=>{
    c.onclick = ()=>{
      Array.prototype.forEach.call(dwBody.querySelectorAll('.chip'), x=>x.classList.remove('on'));
      c.classList.add('on');
      const f = c.getAttribute('data-f');
      const fs = f==='all' ? rows : rows.filter(r=>r[5]===f);
      document.getElementById('stList').innerHTML = listHTML(fs);
      bindRows('stList', fs);
      if(fs.length){ const t=document.getElementById('ctName'); if(t) t.textContent=fs[0][1]; drawChart(fs[0],10); }
    };
  });
}

/* ============ 时序曲线（纯 SVG，无外部依赖） ============ */
function drawChart(row, seed){
  const svg = document.getElementById('chart'); if(!svg) return;
  const W=340,H=150,PL=40,PR=12,PT=14,PB=24;
  const labels=['25-11','25-12','26-01','26-02','26-03','26-04','26-05','26-06','26-07','26-08','26-09','26-10'];
  const base = Math.abs(row[3]);
  const vals = labels.map((_,i)=>{
    const t = i/(labels.length-1);
    const noise = Math.sin(seed*1.7+i*0.9)*base*0.05 + Math.sin(seed*3.1+i*1.4)*base*0.03;
    const v = row[4] < 0 ? -(base*t*1.06 + noise) : base - base*t*0.5 + noise;
    return +v.toFixed(2);
  });
  const mn0 = Math.min.apply(null, vals.concat([0]));
  const mx0 = Math.max.apply(null, vals.concat([0]));
  const pad = (mx0-mn0)*0.18 || 1;
  const mn = mn0-pad, mx = mx0+pad;
  const X = i => PL + i*(W-PL-PR)/(labels.length-1);
  const Y = v => PT + (mx-v)/(mx-mn)*(H-PT-PB);

  let g = '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".42"/>'+
    '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
  for(let k=0;k<=3;k++){
    const yy = PT + k*(H-PT-PB)/3;
    const vv = mx - k*(mx-mn)/3;
    g += '<line class="grid" x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'"/>'+
         '<text class="tick" x="3" y="'+(yy+3.2).toFixed(1)+'">'+vv.toFixed(1)+'</text>';
  }
  g += '<line class="axis" x1="'+PL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(0).toFixed(1)+'" stroke-dasharray="2 3"/>';
  g += '<line class="axis" x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'"/>';
  labels.forEach((l,i)=>{ if(i%2===0||i===labels.length-1)
    g += '<text class="tick" x="'+X(i).toFixed(1)+'" y="'+(H-PB+11)+'" text-anchor="middle">'+l+'</text>'; });
  const pts = vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const zeroY = Y(0).toFixed(1);
  g += '<polygon class="areaA" points="'+PL+','+zeroY+' '+pts+' '+X(labels.length-1).toFixed(1)+','+zeroY+'"/>'+
       '<polyline class="lineA" points="'+pts+'"/>';
  vals.forEach((v,i)=>{
    g += '<circle class="dotA'+(i===vals.length-1?' dotNow':'')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+
      '" r="'+(i===vals.length-1?4:3)+'" data-v="'+v+'" data-l="'+labels[i]+'"/>';
  });
  g += '<text class="tick" x="'+(W-PR)+'" y="'+(PT+1)+'" text-anchor="end" style="fill:var(--accent);font-size:9.5px">单位：'+curUnit+'</text>';
  svg.innerHTML = g;

  const tip = document.getElementById('tip');
  Array.prototype.forEach.call(svg.querySelectorAll('.dotA'), d=>{
    d.onmouseenter = ()=>{
      tip.style.opacity='1';
      tip.innerHTML = d.getAttribute('data-l')+'&nbsp;&nbsp;<b style="color:var(--accent-2)">'+d.getAttribute('data-v')+' '+curUnit+'</b>';
      const r = svg.getBoundingClientRect(), dr = d.getBoundingClientRect();
      tip.style.left = Math.min(Math.max(dr.left-r.left-30,0), 210)+'px';
      tip.style.top  = Math.max(dr.top-r.top-32,0)+'px';
    };
    d.onmouseleave = ()=>{ tip.style.opacity='0'; };
  });
}

/* ============ 通用交互 ============ */
let tt;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 1800);
}
Array.prototype.forEach.call(document.querySelectorAll('.dock-item'), d=>{
  d.onclick = ()=>{
    Array.prototype.forEach.call(document.querySelectorAll('.dock-item'), x=>x.classList.remove('on'));
    d.classList.add('on'); toast('切换面板：'+d.textContent.trim());
  };
});
